[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-agentic"
version = "0.1.0"
description = "An agent-architecture backend testing framework for REST, GraphQL, DB, Kafka/event-driven and data-reconciliation scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "backend-agentic" }]

dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3",
    "assertpy2[polars,json,allure]>=2.25",
    "polars>=1.9",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "structlog>=24.4",
    "rich>=13.8",
    "faker>=30.0",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "connectorx>=0.3.3"]
kafka = ["confluent-kafka>=2.5"]
perf = ["locust>=2.31"]
containers = ["testcontainers[postgres,kafka]>=4.8"]
reporting = ["allure-pytest>=2.13"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]
all = [
    "backend-agentic[db,kafka,perf,containers,reporting]",
]

[project.entry-points.pytest11]
backend_agentic = "backend_agentic.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "rest: REST API scenarios",
    "graphql: GraphQL API scenarios",
    "db: database scenarios",
    "kafka: event-driven / Kafka scenarios",
    "reconciliation: cross-system data reconciliation scenarios",
    "perf: load/performance scenarios (runs Locust headlessly)",
    "e2e: end-to-end multi-agent scenarios",
    "slow: long-running scenario, excluded from the fast local loop",
]
assertpy2_profile = "strict"
assertpy2_allure = "full"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
