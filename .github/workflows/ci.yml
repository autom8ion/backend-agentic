name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librdkafka-dev
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librdkafka-dev
      - run: uv sync --all-extras
      - run: cp .env.example .env

      - name: Start demo stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Wait for demo app to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "demo app never became healthy" >&2
          docker compose -f docker/docker-compose.yml logs
          exit 1

      # perf (Locust) scenarios are excluded from CI: SLO thresholds tuned
      # for a local machine are flaky on shared runners. Run them manually
      # via `uv run pytest -m perf` when tuning thresholds.
      - name: Run tests
        run: uv run pytest -m "not perf" --junitxml=test-results/junit.xml

      - name: Stop demo stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

      # Consumed by the KPI-Dashboard qa_collector (JUnit XML -> per-test pass/fail/duration).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 14
